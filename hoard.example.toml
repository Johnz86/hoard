[server]
bind = "0.0.0.0:7099"
public_url = "http://hoard.lan:7099"
data_dir = "./data"
# Directories outside <data_dir>/profiles that `hoard link` may write symlinks into.
# Empty means projections stay under the data directory.
projection_roots = []

[node]
name = "workstation"
serve = true
discovery = "mdns"

[peers]
static = []

[index]
hash_policy = "background"
lfs_threshold = 10485760
triage_confidence = 0.85
# Index what changes under a source while `hoard serve` runs, without a manual scan.
watch = true
# How often to rescan every source regardless of what the watch reported. 0 turns it off.
reconcile_interval_secs = 3600
# How many files a hashing pass reads at once. 0 means one worker per core; turn it down on
# an HDD or a NAS.
hash_threads = 0
# The redb page cache, in mebibytes. Turning it down bounds what one open catalog holds in
# memory for pages it has already read, at the cost of rereading them from disk more often.
# 0 means the default, the same way hash_threads = 0 means one worker per core.
cache_mib = 256

[[index.sources]]
name = "hf-cache"
path = "~/.cache/huggingface/hub"
kind = "hf-cache"

[[index.sources]]
name = "comfy"
path = "~/comfy/models"
kind = "loose"
exclude = ["**/*.tmp", "**/.cache/**"]

[[index.sources]]
name = "vault"
path = "/mnt/vault/hf"
kind = "auto"

[mirror]
offline = false
upstream = "https://huggingface.co"
upstream_lfs = "https://cdn-lfs.huggingface.co"
cache_size_limit = "500GB"
cache_clean_strategy = "LRU"
block_size = "64MiB"
chunk_size = "1MiB"
xet_passthrough = false
xet_passthrough_min_size = "50GB"

[[mirror.proxy]]
repo = "*"
allow = true

[[mirror.proxy]]
repo = "*/*"
allow = true

[[mirror.cache]]
repo = "*"
allow = true

[[mirror.cache]]
repo = "*/*"
allow = true
