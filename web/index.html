<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hoard</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/pico.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/hoard.css?v=sources-view">
</head>
<body>
<div class="shell">
    <header class="topbar">
        <span class="wordmark" id="wordmark">HOARD</span>
        <nav class="nav-tabs" id="nav-tabs"></nav>
        <div class="search" id="search">
            <button class="search-glyph" id="shelf-trigger" type="button"
                    aria-label="Shelves" aria-controls="shelf-popover" aria-expanded="false"
                    aria-haspopup="dialog" title="Shelves">&#9906;</button>
            <input id="search-input" type="text" spellcheck="false" autocomplete="off"
                   placeholder="role:lora base:sdxl size:&lt;400mb film grain">
            <span class="search-clear" id="search-clear" hidden>CLEAR</span>
            <span class="search-hint" id="search-hint">/</span>
        </div>
        <span class="node-pulse" id="node-pulse" title="Sources"></span>
        <button class="btn btn-amber" id="loadout-btn" type="button">LOADOUT 0</button>
        <div class="prefs-wrap">
            <button class="btn btn-quiet btn-prefs" id="prefs-btn" type="button"
                    aria-label="Preferences" aria-controls="prefs-panel" aria-expanded="false"
                    title="Preferences">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M10.3 2.8h3.4l.6 2.2c.5.2 1 .4 1.4.8l2-.9 2.4 2.4-.9 2c.3.4.6.9.8 1.4l2.2.6v3.4l-2.2.6c-.2.5-.4 1-.8 1.4l.9 2-2.4 2.4-2-.9c-.4.3-.9.6-1.4.8l-.6 2.2h-3.4l-.6-2.2c-.5-.2-1-.4-1.4-.8l-2 .9-2.4-2.4.9-2c-.3-.4-.6-.9-.8-1.4l-2.2-.6v-3.4l2.2-.6c.2-.5.4-1 .8-1.4l-.9-2 2.4-2.4 2 .9c.4-.3.9-.6 1.4-.8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
            <div class="prefs-panel" id="prefs-panel" hidden></div>
        </div>
    </header>

    <div class="token-strip" id="token-strip" hidden>
        <div class="token-content" id="token-content"></div>
        <button class="strip-add-shelf" id="add-shelf" type="button" hidden
                aria-controls="shelf-popover" aria-expanded="false"
                aria-haspopup="dialog">ADD TO SHELF</button>
    </div>

    <main class="views">
        <section class="view view-index" id="view-index">
            <aside class="facet-rail" id="facet-rail"></aside>
            <div class="results">
                <div class="results-head" id="results-head"></div>
                <div class="result-body" id="result-body"></div>
                <div class="results-foot" id="results-foot"></div>
            </div>
            <div class="inspector-slot" id="inspector-slot"></div>
        </section>
        <section class="view" id="view-detail" hidden></section>
        <section class="view view-panel-host" id="view-panel" hidden></section>
    </main>
</div>

<div id="drawer-root"></div>
<div id="keysheet-root"></div>
<div id="toast-root"></div>

<script type="module" src="js/app.js?v=sources-view"></script>
</body>
</html>
